schema_version: "0.2"
experiment:
  id: example_experiment
subjects:
  - id: example_subject
    agent:
      name: Example Agent
    model:
      name: example-model
requirements:
  - id: complete_task
    dimension: goal
    statement: Complete the task.
    applicability: The scenario is executed.
    compliance: The declared check passes.
checks:
  - id: check_result
    evaluator: example_evaluator
scenarios:
  - id: example_scenario
    task:
      prompt: Return {"result":{"count":6}}.
      output_semantics:
        scalar_fields:
          - path: result.count
            semantic_type: integer
            accepted_serializations:
              - native
              - canonical_string
    opportunities:
      - id: goal
        requirement_id: complete_task
        check_id: check_result
evidence_policy:
  capture:
    - final_response
run_protocol:
  repetitions: 1
  reset:
    conversation: fresh
    memory: baseline
    workspace: baseline
    environment: baseline
  termination:
    max_steps: 1
