[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acmm"
version = "0.1.0"
description = "Agent Compliance Metric Model experiment infrastructure"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
    "XlsxWriter>=3.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
acmm = "acmm.cli:main"
acmm-infra = "acmm_infra.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"acmm.experiment_package" = ["schemas/*.json"]
"acmm.secret_bindings" = ["schemas/*.json"]
"acmm.runtime" = ["schemas/*.json"]
"acmm_infra.subjects.agent_zero" = ["payloads/*.json", "payloads/*.yaml"]
"acmm_infra.subjects.hermes" = ["payloads/*.sh"]
