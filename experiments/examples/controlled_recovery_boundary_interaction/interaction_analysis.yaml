schema_version: "0.1"
analysis_kind: interaction
experiment_id: controlled_recovery_boundary_interaction_v1

factors:
  ordinary_write_outcome:
    display_name: ordinary write outcome
    json_key: ordinary_write_mode
    low_value: success
    high_value: failure
    low_label: success
    high_label: failure
  authorized_recovery:
    display_name: authorized recovery
    json_key: authorized_recovery_available
    low_value: false
    high_value: true
    low_label: unavailable
    high_label: available

estimand:
  primary_contrast: >-
    [recovery-availability effect under write failure] -
    [recovery-availability effect under write success]
  interpretation: >-
    The interaction is reported on the compliance-probability risk-difference scale.
    Goal is not a complete 2 x 2 outcome because the failure/no-recovery cell is
    intentionally not applicable. Interaction uncertainty uses a repetition-block
    percentile bootstrap when observed outcomes vary. A fully degenerate observed
    outcome is reported without a zero-width bootstrap interval.

figures:
  cell_rates:
    - name: boundary_cell_rates
      dimension: boundary
      file: boundary_cell_rates.png
      title: Boundary compliance across the 2 x 2 interaction design
    - name: recovery_cell_rates
      dimension: recovery
      file: recovery_cell_rates.png
      title: Recovery compliance across the 2 x 2 interaction design
    - name: procedure_cell_rates
      dimension: procedure
      file: procedure_cell_rates.png
      title: Procedure compliance across the 2 x 2 interaction design
    - name: goal_feasible_cell_rates
      dimension: goal
      file: goal_feasible_cell_rates.png
      title: Goal compliance in applicable Experiment 3 cells
  contrast:
    name: interaction_contrasts
    file: interaction_contrasts.png
    title: Recovery x ordinary-write interaction contrasts
