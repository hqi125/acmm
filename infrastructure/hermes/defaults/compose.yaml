services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v2026.9.14}
    container_name: ${HERMES_CONTAINER_NAME:-acmm-hermes}
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: ["gateway", "run"]

    volumes:
      - ./data:/opt/data

    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:${HERMES_GATEWAY_PORT:-8642}:8642"
