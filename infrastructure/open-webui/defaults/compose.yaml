services:
  open-webui:
    image: ${OPEN_WEBUI_IMAGE}
    container_name: ${OPEN_WEBUI_CONTAINER_NAME:-acmm-open-webui}
    restart: unless-stopped

    volumes:
      - ./data:/app/backend/data

    environment:
      OLLAMA_BASE_URL: "${OPEN_WEBUI_OLLAMA_BASE_URL}"
      WEBUI_AUTH: "${OPEN_WEBUI_AUTH:-false}"
      WEBUI_SECRET_KEY_FILE: "${OPEN_WEBUI_SECRET_KEY_FILE}"
      ENABLE_OLLAMA_API: "${OPEN_WEBUI_ENABLE_OLLAMA_API:-true}"
      ENABLE_OPENAI_API: "${OPEN_WEBUI_ENABLE_OPENAI_API:-false}"
      ENABLE_PLUGINS: "${OPEN_WEBUI_ENABLE_PLUGINS:-true}"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "${OPEN_WEBUI_ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS:-false}"
      ENABLE_DIRECT_CONNECTIONS: "${OPEN_WEBUI_ENABLE_DIRECT_CONNECTIONS:-false}"
      ENABLE_DIRECT_INTEGRATIONS: "${OPEN_WEBUI_ENABLE_DIRECT_INTEGRATIONS:-false}"
      ENABLE_WEB_SEARCH: "${OPEN_WEBUI_ENABLE_WEB_SEARCH:-false}"
      ENABLE_CODE_EXECUTION: "${OPEN_WEBUI_ENABLE_CODE_EXECUTION:-false}"
      ENABLE_CODE_INTERPRETER: "${OPEN_WEBUI_ENABLE_CODE_INTERPRETER:-false}"
      ENABLE_MEMORIES: "${OPEN_WEBUI_ENABLE_MEMORIES:-false}"
      ENABLE_MEMORY_SYSTEM_CONTEXT: "${OPEN_WEBUI_ENABLE_MEMORY_SYSTEM_CONTEXT:-false}"
      ENABLE_MEMORY_BACKGROUND_REVIEW: "${OPEN_WEBUI_ENABLE_MEMORY_BACKGROUND_REVIEW:-false}"
      ENABLE_IMAGE_GENERATION: "${OPEN_WEBUI_ENABLE_IMAGE_GENERATION:-false}"
      ENABLE_IMAGE_PROMPT_GENERATION: "${OPEN_WEBUI_ENABLE_IMAGE_PROMPT_GENERATION:-false}"
      ENABLE_TITLE_GENERATION: "${OPEN_WEBUI_ENABLE_TITLE_GENERATION:-false}"
      ENABLE_TAGS_GENERATION: "${OPEN_WEBUI_ENABLE_TAGS_GENERATION:-false}"
      ENABLE_FOLLOW_UP_GENERATION: "${OPEN_WEBUI_ENABLE_FOLLOW_UP_GENERATION:-false}"
      ENABLE_AUTOCOMPLETE_GENERATION: "${OPEN_WEBUI_ENABLE_AUTOCOMPLETE_GENERATION:-false}"
      ENABLE_SEARCH_QUERY_GENERATION: "${OPEN_WEBUI_ENABLE_SEARCH_QUERY_GENERATION:-false}"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "${OPEN_WEBUI_ENABLE_RETRIEVAL_QUERY_GENERATION:-false}"
      TOOL_SERVER_CONNECTIONS: "${OPEN_WEBUI_TOOL_SERVER_CONNECTIONS:-[]}"
      TERMINAL_SERVER_CONNECTIONS: "${OPEN_WEBUI_TERMINAL_SERVER_CONNECTIONS:-[]}"
      SCARF_NO_ANALYTICS: "${OPEN_WEBUI_SCARF_NO_ANALYTICS:-true}"
      DO_NOT_TRACK: "${OPEN_WEBUI_DO_NOT_TRACK:-true}"
      ANONYMIZED_TELEMETRY: "${OPEN_WEBUI_ANONYMIZED_TELEMETRY:-false}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
