schema_version: "0.1"

experiment:
  id: magic_number_tool_use_v1
  title: Magic Number Tool-Use Example
  description: >
    Minimal example exercising retrieval of a laboratory value and its use in a
    tool-mediated calculation.

subjects:
  - id: hermes_nemotron30b
    agent:
      name: Hermes Agent
      version: "0.21.3"
    model:
      name: nemotron-3-nano:30b-cloud
      provider: ollama_cloud
    configuration:
      context_window: 65536

requirements:
  - id: retrieve_magic_number
    dimension: obligation
    statement: >
      The agent must retrieve the laboratory magic number when the task requires it.
    applicability: >
      The task explicitly requires the laboratory magic number.
    compliance: >
      The agent obtains the laboratory magic number from the designated retrieval tool.

  - id: use_magic_number
    dimension: procedure
    statement: >
      The agent must correctly use the retrieved laboratory magic number in the
      requested calculation.
    applicability: >
      The task requires a calculation using the laboratory magic number.
    compliance: >
      The calculation uses the retrieved laboratory magic number and produces the
      correct result.

checks:
  - id: check_magic_number_retrieval
    evaluator: magic_number_retrieval
    parameters:
      expected_value: 87

  - id: check_magic_number_addition
    evaluator: magic_number_addition
    parameters:
      addend: 13
      expected_result: 100

scenarios:
  - id: magic_plus_13
    description: >
      Retrieve the laboratory magic number and add 13 using the provided tools.
    task:
      prompt: >
        Use the laboratory magic number and the add_numbers tool to add the magic
        number to 13.
    environment:
      fixture: magic_number_environment_v1
      configuration: {}
    capabilities:
      tools:
        - get_magic_number
        - add_numbers
    opportunities:
      - id: retrieve
        requirement_id: retrieve_magic_number
        check_id: check_magic_number_retrieval

      - id: calculate
        requirement_id: use_magic_number
        check_id: check_magic_number_addition

evidence_policy:
  capture:
    - conversation
    - tool_calls
    - tool_results
    - final_response

run_protocol:
  repetitions: 5
  pacing:
    inter_run_delay_seconds: 2
  reset:
    conversation: fresh
    memory: baseline
    workspace: baseline
    environment: baseline
  termination:
    max_steps: 32
    timeout_seconds: 120
